name: CI scroll test (temporary)
on:
  push:
    branches: [ci-scroll-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [r8-current, r8-compat-dontoptimize, r8-broad-keeps, no-r8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      - name: Apply variant
        run: |
          set -e
          case "${{ matrix.variant }}" in
            r8-current) ;;
            r8-compat-dontoptimize)
              echo "android.enableR8.fullMode=false" >> android/gradle.properties
              sed -i "s/proguard-android-optimize.txt/proguard-android.txt/" android/app/build.gradle
              printf '\n-dontoptimize\n' >> android/app/proguard-rules.pro ;;
            r8-broad-keeps)
              printf '\n-keep class com.getcapacitor.** { *; }\n-keep class com.capacitorjs.** { *; }\n-keep class ee.forgr.** { *; }\n-keep class com.medladder.** { *; }\n-keep class androidx.webkit.** { *; }\n-keep class androidx.coordinatorlayout.** { *; }\n-keep class androidx.core.view.** { *; }\n-keep class androidx.activity.** { *; }\n' >> android/app/proguard-rules.pro ;;
            no-r8)
              sed -i "s/minifyEnabled true/minifyEnabled false/; s/shrinkResources true/shrinkResources false/" android/app/build.gradle ;;
          esac
      - name: Restore keystore and Firebase config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/k.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/k.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: medladder
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scroll-test.sh ${{ matrix.variant }}
      - name: Save result
        if: always()
        run: |
          mkdir -p results
          cp result-*.txt results/ 2>/dev/null || echo "no result" > results/result-${{ matrix.variant }}.txt
          git config user.name ci; git config user.email ci@example.com
          for i in 1 2 3 4 5; do
            git fetch -q origin ci-scroll-results 2>/dev/null && git checkout -q -B r origin/ci-scroll-results || git checkout -q --orphan r
            git rm -rq --cached . >/dev/null 2>&1 || true
            cp results/* . ; git add result-*.txt
            git commit -qm "result ${{ matrix.variant }}" && git push -q origin HEAD:ci-scroll-results && break
            sleep $((RANDOM % 10 + 3))
          done
